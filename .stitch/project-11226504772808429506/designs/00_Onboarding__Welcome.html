<!DOCTYPE html>

<div class="flex flex-col items-center text-center gap-md mb-xl w-full">
<div class="w-[64px] h-[64px] bg-primary-container/10 rounded-xl flex items-center justify-center mb-sm">

</div>

<div class="flex flex-col items-center text-center gap-sm p-md bg-[#F6F7F9] rounded-lg">

</div>
<div class="flex flex-col items-center text-center gap-sm p-md bg-[#F6F7F9] rounded-lg">
<span class="material-symbols-outlined text-[24px] text-primary-container">local_shipping</span>
<span class="font-heading-md text-body-sm font-semibold text-on-surface">Order & shipping answers</span>
</div>
<div class="flex flex-col items-center text-center gap-sm p-md bg-[#F6F7F9] rounded-lg">

</div>
</div>

<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">

<button class="bg-primary-container hover:bg-tertiary-container transition-colors text-on-primary font-heading-md text-body-md px-[24px] py-[10px] rounded-lg shadow-sm flex items-center gap-sm">
