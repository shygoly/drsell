# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0b36b70772220b71b2fe296b3deba914"
name = "Dr Sell"
# 必须指向 /app：nginx 把根路径给了 apps/storefront（独立账号体系的商家面板），
# 指向根路径会让 Shopify 在 admin iframe 里加载那个第三方登录页。
application_url = "https://drsell.szchada.top/app"
embedded = true
handle = "drseller-alpha"

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  topics = [
  "orders/create",
  "products/delete",
  "products/update",
  "orders/delete",
  "products/create",
  "orders/updated",
  "app/uninstalled",
  "app/scopes_update"
]

  # Shopify 强制合规 webhook 单独走 /webhook（apps/web 代理 → apps/api 同一入口）
  [[webhooks.subscriptions]]
  uri = "/webhook"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access.admin]
direct_api_mode = "online"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_orders,read_products,write_orders,write_products"

[auth]
redirect_urls = [
  "https://drsell.szchada.top/api/auth/callback",
  "https://drsell.szchada.top/auth/callback",
  "https://drsell.szchada.top/auth/shopify/callback"
]

[pos]
embedded = false
