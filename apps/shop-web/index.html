<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drsell Store — 独立站</title>
  <meta name="description" content="Drsell DTC 独立站 · 由 Medusa 驱动，内置 AI 智能客服" />
  <style>
    :root {
      --bg: #fafaf9; --surface: #ffffff; --ink: #1c1917; --muted: #78716c;
      --line: #e7e5e4; --accent: #008060; --accent-ink: #ffffff; --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    header.site {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255,255,255,.85); backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .bar { max-width: 1080px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
    .brand { font-weight: 700; letter-spacing: .12em; font-size: 18px; }
    .brand .dot { color: var(--accent); }
    .bar .spacer { flex: 1; }
    .bar .nav { color: var(--muted); font-size: 13.5px; display: flex; gap: 18px; }
    .hero { max-width: 1080px; margin: 0 auto; padding: 44px 20px 8px; }
    .hero h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -.01em; }
    .hero p { color: var(--muted); margin: 0; max-width: 46ch; }
    main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 96px; }
    .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 28px 2px 14px; }
    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .18s, transform .18s;
    }
    .card:hover { box-shadow: 0 8px 26px rgba(0,0,0,.07); transform: translateY(-2px); }
    .thumb { aspect-ratio: 1 / 1; background: #f5f5f4 center/cover no-repeat; }
    .card .body { padding: 13px 14px 16px; display: flex; flex-direction: column; gap: 6px; }
    .card .name { font-weight: 600; font-size: 14.5px; }
    .card .price { color: var(--ink); font-variant-numeric: tabular-nums; }
    .card .muted { color: var(--muted); font-size: 12.5px; }
    .state { color: var(--muted); padding: 40px 4px; }
    .skeleton .thumb { background: linear-gradient(90deg,#f0efee,#f7f6f5,#f0efee); background-size: 200% 100%; animation: sh 1.2s infinite; }
    @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    footer.site { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    footer.site .bar { padding: 22px 20px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted); }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    @media (max-width: 560px) { .hero h1 { font-size: 24px; } .bar .nav { display: none; } }
  </style>
</head>
<body>
  <header class="site">
    <div class="bar">
      <div class="brand">DRSELL<span class="dot">.</span></div>
      <div class="spacer"></div>
      <nav class="nav"><span>全部商品</span><span>关于</span><span>联系我们</span></nav>
    </div>
  </header>

  <section class="hero">
    <span class="pill"><span class="dot"></span> Medusa 驱动 · AI 智能客服在线</span>
    <h1 style="margin-top:14px">精选好物，问答即答</h1>
    <p>这是 Drsell 独立站示例店面。右下角的智能客服可实时回答商品、价格与订单问题——试着问它「有哪些商品？」。</p>
  </section>

  <main>
    <div class="section-title">全部商品</div>
    <div id="grid" class="grid" aria-live="polite"></div>
    <div id="state" class="state">正在加载商品…</div>
  </main>

  <footer class="site">
    <div class="bar">© <span id="yr"></span> Drsell Store · 由 Medusa + Drsell AI 客服驱动</div>
  </footer>

  <script>
    // Medusa Store API 同源调用（nginx 把 /store 反代到 Medusa :9000）。
    // 发布密钥（publishable key）本就用于前端、可公开；部署时注入。
    var MEDUSA_PUBLISHABLE_KEY = "__PUBLISHABLE_KEY__";
    var MEDUSA_REGION_ID = "__REGION_ID__";
    var CURRENCY = { eur: "€", usd: "$", cny: "¥", gbp: "£" };

    document.getElementById("yr").textContent = new Date().getFullYear();

    function money(v) {
      if (!v || !v.calculated_price) return "";
      var a = v.calculated_price.calculated_amount;
      var c = (v.calculated_price.currency_code || "").toLowerCase();
      if (a == null) return "";
      return (CURRENCY[c] || (c.toUpperCase() + " ")) + Number(a).toFixed(2);
    }

    function card(p) {
      var el = document.createElement("div");
      el.className = "card";
      var v = (p.variants && p.variants[0]) || null;
      var price = money(v);
      el.innerHTML =
        '<div class="thumb"' + (p.thumbnail ? ' style="background-image:url(\'' + p.thumbnail.replace(/"/g, "") + '\')"' : "") + '></div>' +
        '<div class="body">' +
          '<div class="name">' + (p.title || "未命名商品") + "</div>" +
          '<div class="price">' + (price || '<span class="muted">价格待定</span>') + "</div>" +
        "</div>";
      return el;
    }

    (function load() {
      var grid = document.getElementById("grid");
      var state = document.getElementById("state");
      // 骨架屏
      for (var i = 0; i < 4; i++) {
        var s = document.createElement("div");
        s.className = "card skeleton";
        s.innerHTML = '<div class="thumb"></div><div class="body"><div class="name">&nbsp;</div><div class="price">&nbsp;</div></div>';
        grid.appendChild(s);
      }
      var url = "/store/products?limit=24&region_id=" + encodeURIComponent(MEDUSA_REGION_ID) +
                "&fields=title,handle,thumbnail,*variants.calculated_price";
      fetch(url, { headers: { "x-publishable-api-key": MEDUSA_PUBLISHABLE_KEY } })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (d) {
          grid.innerHTML = "";
          var list = (d && d.products) || [];
          if (!list.length) { state.textContent = "暂无商品。"; return; }
          list.forEach(function (p) { grid.appendChild(card(p)); });
          state.textContent = "";
        })
        .catch(function (e) {
          grid.innerHTML = "";
          state.textContent = "商品加载失败（" + e.message + "）。你仍可点击右下角客服咨询。";
        });
    })();
  </script>

  <!-- Drsell AI 智能客服挂件 (Phase 7)。data-shop 必须等于 drsell 侧该店 Shop.shopDomain (= INGEST_STORE_DOMAIN)。 -->
  <div id="drsell-chat-root" data-shop="drsell-shop.szchada.top"></div>
  <script>window.DRSELL_API_BASE = "https://drsell.szchada.top/api";</script>
  <script src="https://drsell.szchada.top/drsell-chat.js" defer></script>
</body>
</html>
