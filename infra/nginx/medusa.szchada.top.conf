# medusa.szchada.top — DTC 独立站「内容式官网」（openspec dtc-store-medusa）
#   /app /admin /store /auth /health -> Medusa v2 后台+API (127.0.0.1:9000)
#   /                                 -> 店面静态服务 drsell-shop-web (127.0.0.1:5020, pm2)
# 店面与 Store API 同源，故 /store/products 与 POST /store/inquiries 都无 CORS 问题——
# 询价表单正因此可以直接 POST 同源。AI 客服挂件则 POST 到 drsell.szchada.top/api（CORS 放行）。
# 边缘：CF(Full) -> :443 nginx stream SNI-demux -> :8443（本 vhost 终止 TLS）。
#
# ⚠ 本文件是 2026-09-13 从容器里取回的**唯一副本**（此前只存在于服务器上，
#   见 DEPLOY.md §7）。改这里之后必须跑 scripts/deploy-shop.sh 同步，否则改动只在本地。
# 证书是自签的（/opt/webrtc-ws-proxy/certs/medusa.szchada.top.{crt,key}），不是 ACME。
server {
  listen 80;
  server_name medusa.szchada.top;
  server_tokens off;
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; try_files $uri =404; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 8443 ssl;
  http2 on;
  server_name medusa.szchada.top;
  server_tokens off;

  ssl_certificate     /etc/nginx/certs/medusa.szchada.top.crt;
  ssl_certificate_key /etc/nginx/certs/medusa.szchada.top.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  client_max_body_size 50m;

  # ---- Medusa 后台 UI（Vite base=/app）----
  # 后台在公网可达，登录页与静态资源都是暴露面，故套一道 HTTP Basic 作第二把锁。
  # 凭据文件在 certs 挂载卷（/opt/webrtc-ws-proxy/certs/medusa-admin.htpasswd），
  # **不入库**；口令在 /root/.medusa-admin-pw（600）。
  #
  # ⚠ **Basic 只能加在 /app（UI 外壳），绝不能加在 /admin（数据接口）**。
  #   2026-09-13 踩过：给 /admin 也加 Basic 后，后台页面**登录成功但整页空白**。
  #   原因是 `Authorization` 头**一次只能承载一种认证方案**——
  #   后台 SPA 的 XHR 要发 `Authorization: Bearer <medusa-jwt>`（Medusa 自己的会话），
  #   而 Basic 要的是 `Authorization: Basic <base64>`。同一个头，二选一：
  #   发了 Bearer 就没有 Basic → nginx 判 401（返回的是 **nginx 的 HTML 401**，
  #   不是 Medusa 的 JSON）→ SPA 取不到数据 → 空白页。
  #   静态外壳（本文档的 HTML/JS/CSS）由浏览器带 Basic 取，不冲突；
  #   数据接口交给 **Medusa 自己的鉴权**（无 token 实测 401 JSON）。
  #
  # 判据：`/app` 无凭据 = 401，`/admin/**` 无 token = **Medusa 的 JSON 401**（非 nginx HTML）。
  location ^~ /app {
    auth_basic           "Drsell Admin";
    auth_basic_user_file /etc/nginx/certs/medusa-admin.htpasswd;
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
  # ---- Medusa API ----
  # /admin/** 只靠 Medusa 自身鉴权（**不**加 Basic，见上）。
  location ^~ /admin  { proxy_pass http://127.0.0.1:9000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 120s; }
  # /store 与 /auth 是**店面**与顾客登录要用的公开 API，**不能加 Basic**
  # （否则顾客侧询价与登录全挂）。
  location ^~ /store  { proxy_pass http://127.0.0.1:9000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 120s; }
  location ^~ /auth   { proxy_pass http://127.0.0.1:9000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 120s; }
  location = /health  { proxy_pass http://127.0.0.1:9000; proxy_set_header Host $host; }

  # ---- 店面（静态，pm2 drsell-shop-web）----
  location / {
    proxy_pass http://127.0.0.1:5020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
