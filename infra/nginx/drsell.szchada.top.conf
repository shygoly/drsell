# Host nginx (webrtc-ws-proxy) vhost for Drsell
map $http_upgrade $connection_upgrade_drsell {
  default upgrade;
  '' close;
}

upstream drsell_storefront_upstream {
  server 127.0.0.1:5010;
  keepalive 16;
}

upstream drsell_shopify_upstream {
  server 127.0.0.1:5012;
  keepalive 16;
}

upstream drsell_api_upstream {
  server 127.0.0.1:5011;
  keepalive 16;
}

server {
  listen 80;
  server_name drsell.szchada.top;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Plain HTTP for Cloudflare Worker origin fetch (TLS terminates at CF edge)
server {
  listen 8088;
  server_name drsell.szchada.top;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ^~ /api/auth {
    proxy_pass http://drsell_shopify_upstream;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
  }

  location ^~ /api/webhooks {
    proxy_pass http://drsell_shopify_upstream;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
  }

  # Shopify 强制合规 webhook（customers/data_request 等）与隐私政策页：
  # 精确匹配优先于 `location /`（storefront），转发到 apps/web。
  location = /webhook {
    proxy_pass http://drsell_shopify_upstream;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
  }

  location = /privacy {
    proxy_pass http://drsell_shopify_upstream;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
  }

  location ^~ /api/backend/ {
    proxy_pass http://drsell_shopify_upstream;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
  }

  # apps/web 的静态资产：assetPrefix 让 HTML 引用 /app/_next/*，但 Next 自身仍在
  # /_next/* 提供，故此处剥掉 /app 前缀。nginx 取最长前缀匹配，这条比下面的
  # `location ^~ /app` 更具体，自动优先。
  location ^~ /app/_next/ {
    rewrite ^/app(/_next/.*)$ $1 break;
    proxy_pass http://drsell_shopify_upstream;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # 商家端已统一为 apps/storefront（根路径）。/app 下的嵌入骨架已删除，
  # 但 Shopify admin 里可能残留 .../apps/drseller-alpha/app 这类深链，
  # 会被拼成 /app 打过来。直接 404 会让商家和审核员撞墙，所以带查询串跳回根——
  # shop/host/id_token 必须原样保留，否则 storefront 无法完成 App Bridge 换发。
  location ^~ /app {
    # 用 $host 显式拼地址：nginx 默认按 $server_port 生成绝对 Location，
    # 本站源站监听 8443，会把内部端口泄漏进跳转地址（实测 Location 曾是
    # https://drsell.szchada.top:8443/），公网未必可达。
    return 302 https://$host/$is_args$args;
  }

  location /api/ {
    proxy_pass http://drsell_api_upstream;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://drsell_storefront_upstream;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_drsell;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Accept-Encoding "";
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter '<script src="/_next/' '<script data-app-bridge-compatible src="/_next/';
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name drsell.szchada.top;

  ssl_certificate     /etc/nginx/certs/drsell.szchada.top.crt;
  ssl_certificate_key /etc/nginx/certs/drsell.szchada.top.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

