    proxy_send_timeout 3600s;
    proxy_set_header Accept-Encoding "";
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter '<script src="/_next/' '<script data-app-bridge-compatible src="/_next/';
  }
}
