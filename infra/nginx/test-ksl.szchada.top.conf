# test-ksl.szchada.top — 科塞尔医疗 B2B 内容站【测试部署】（b2b-cs-attach）
#   / 及 /store/*  -> 测试静态服务 + store stub（127.0.0.1:5021，pm2 kossel-site-stub）
# 客服挂件 POST 到 drsell.szchada.top/api（绝对域名，CORS 放行），故本 vhost 无需 /api 代理。
#
# ⚠ 测试部署：/store/* 由 test-store-stub 供（catalog.json→Medusa 形状），**非真实 Medusa**。
#   生产是每客户独立 Medusa 实例（ADR-26），届时本 vhost 改为 medusa.szchada.top 那种
#   /store /admin /auth 分流到真实实例。
# 边缘：CF(Full) -> :443 nginx stream SNI-demux（default -> :8443）-> 本 vhost 终止 TLS。
# 证书自签（/opt/webrtc-ws-proxy/certs/test-ksl.szchada.top.{crt,key} = 容器内 /etc/nginx/certs/）。
# 改这里后必须 rsync 到容器 conf.d 并 `nginx -t && nginx -s reload`。
server {
  listen 80;
  server_name test-ksl.szchada.top;
  server_tokens off;
  location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; try_files $uri =404; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 8443 ssl;
  http2 on;
  server_name test-ksl.szchada.top;
  server_tokens off;

  ssl_certificate     /etc/nginx/certs/test-ksl.szchada.top.crt;
  ssl_certificate_key /etc/nginx/certs/test-ksl.szchada.top.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:5021;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
