# Host nginx (webrtc-ws-proxy) vhost for Drsell
map $http_upgrade $connection_upgrade_drsell {
  default upgrade;
  '' close;
}

upstream drsell_web_upstream {
  server 127.0.0.1:5010;
  keepalive 16;
}

upstream drsell_api_upstream {
  server 127.0.0.1:5011;
  keepalive 16;
}

server {
  listen 80;
  server_name drsell.szchada.top;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name drsell.szchada.top;

  ssl_certificate     /etc/nginx/certs/drsell.szchada.top.crt;
  ssl_certificate_key /etc/nginx/certs/drsell.szchada.top.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://drsell_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://drsell_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade_drsell;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
