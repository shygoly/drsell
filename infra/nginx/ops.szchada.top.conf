# Host nginx vhost for Drsell Ops Console — ADR-11
map $http_upgrade $connection_upgrade_drsell_ops {
  default upgrade;
  '' close;
}

upstream drsell_ops_upstream {
  server 127.0.0.1:5013;
  keepalive 8;
}

upstream drsell_api_upstream_ops {
  server 127.0.0.1:5011;
  keepalive 8;
}

server {
  listen 80;
  server_name ops.szchada.top;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Plain HTTP for Cloudflare origin fetch (TLS terminates at CF edge)
server {
  listen 8088;
  server_name ops.szchada.top;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://drsell_api_upstream_ops;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://drsell_ops_upstream;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_drsell_ops;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name ops.szchada.top;

  ssl_certificate     /etc/nginx/certs/ops.szchada.top.crt;
  ssl_certificate_key /etc/nginx/certs/ops.szchada.top.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://drsell_api_upstream_ops;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://drsell_ops_upstream;
    include /etc/nginx/conf.d/drsell-proxy-headers.inc;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_drsell_ops;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
